# vm-values.yaml

vmsingle:
  spec:
    retentionPeriod: "1d"
    storage:
      resources:
        requests:
          storage: 2Gi

# VictoriaLogs (optional - keep enabled if you also need logs)
vlsingle:
  enabled: true
  spec:
    retentionPeriod: "1d"
    storage:
      resources:
        requests:
          storage: 2Gi

# VictoriaTraces single-node component
vtsingle:
  enabled: true
  spec:
    retentionPeriod: "1d"
    storage:
      resources:
        requests:
          storage: 2Gi

grafana:
  enabled: true
  # Guter Ort für ein PW 😂
  adminPassword: "admin"
  plugins:
    - victoriametrics-logs-datasource
  additionalDataSources:
    # VictoriaLogs datasource
    - name: VictoriaLogs
      type: victoriametrics-logs-datasource
      access: proxy
      url: http://vlsingle-vm-stack-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:9428
      isDefault: false

    # VictoriaTraces uses the native Jaeger datasource for waterfall visualization
    - name: VictoriaTraces
      type: jaeger
      access: proxy
      url: http://vtsingle-vm-stack-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:10428
      isDefault: false

vmalert:
  enabled: false
alertmanager:
  enabled: false
nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true